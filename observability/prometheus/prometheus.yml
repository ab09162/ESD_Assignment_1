global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: campus-app
    static_configs:
      - targets: [app:8000]
        labels:
          service: campus-booking
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          machine: docker-desktop-linux-vm
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  # Intentionally DOWN outside the optional cardinality experiment.
  - job_name: cardinality-demo
    static_configs:
      - targets: [cardinality-demo:8010]
